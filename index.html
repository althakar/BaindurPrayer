<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Industries, Mysore - Wholesale Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; font-size: 14px; }
        .touch-target { min-height: 48px; min-width: 48px; }
        @media print {
            body * { visibility: hidden; }
            #printable-report, #printable-report * { visibility: visible; }
            #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between">

    <div id="app" class="flex-1 flex flex-col max-w-lg mx-auto w-full bg-white shadow-2xl overflow-hidden relative border-x border-slate-200/60">
        
        <!-- HEADER -->
        <header class="bg-gradient-to-r from-slate-900 to-slate-800 text-white py-1.5 px-6 flex justify-between items-center shadow-lg">
            <div class="flex items-center space-x-3.5">
                <div class="bg-indigo-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-base shadow-sm">GI</div>
                <div>
                    <h1 class="font-bold text-base md:text-lg tracking-wide">GLOBAL INDUSTRIES</h1>
                    <p class="text-xs text-slate-300 font-medium">Mysore • Wholesale Portal</p>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-1.5"></div>
        </header>

        <!-- MAIN VIEW PORT -->
        <main id="main-content" class="flex-1 overflow-y-auto p-5 pb-32"></main>

        <!-- BOTTOM NAVIGATION CART BAR -->
        <div id="bottom-bar" class="hidden absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-4 shadow-2xl flex justify-between items-center z-40">
            <div class="flex items-center space-x-3">
                <span id="cart-item-count" class="text-xs font-bold bg-slate-900 text-white px-3.5 py-1.5 rounded-full shadow-xs">0 items</span>
                <span id="cart-total-amount" class="font-bold text-slate-900 text-base">₹0.00</span>
            </div>
            <button onclick="goToCheckout()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl font-semibold text-xs transition shadow-md active:scale-95 flex items-center space-x-1.5">
                <span>Checkout</span><span>&rarr;</span>
            </button>
        </div>

        <!-- PRODUCT EDIT MODAL -->
        <div id="product-edit-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-sm border border-slate-100 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-900">Edit Product Details</h3>
                    <button onclick="closeEditProductModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <input type="hidden" id="edit-prod-id">
                <div class="text-center">
                    <div id="edit-prod-img-preview" class="mb-2 flex justify-center"></div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Image URL</label>
                    <input type="text" id="edit-prod-img" oninput="updateEditImgPreview(this.value)" class="w-full border border-slate-200 rounded-2xl p-2.5 text-xs bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Product Name</label>
                    <input type="text" id="edit-prod-name" class="w-full border border-slate-200 rounded-2xl p-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
                        <input type="text" id="edit-prod-cat" class="w-full border border-slate-200 rounded-2xl p-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Stock Qty</label>
                        <input type="number" id="edit-prod-stock" class="w-full border border-slate-200 rounded-2xl p-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Assigned Vendor</label>
                    <select id="edit-prod-vendor" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Selling Price (₹)</label>
                        <input type="number" id="edit-prod-price" class="w-full border border-slate-200 rounded-2xl p-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 font-bold text-emerald-700 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Cost Price (₹)</label>
                        <input type="number" id="edit-prod-cost" class="w-full border border-slate-200 rounded-2xl p-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    </div>
                </div>

                <!-- WEIGHT METAL OPTIONS FOR EDIT -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="edit-prod-is-weight" onchange="toggleEditWeightDropdown(this.checked)" class="w-4 h-4 text-indigo-600 rounded-md border-slate-300">
                        <span class="text-xs font-bold text-slate-700">Is this a Weight-Based Metal Item?</span>
                    </label>
                    <div id="edit-metal-type-container" class="hidden">
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Select Metal Type</label>
                        <select id="edit-prod-metal-type" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                            <option value="Aluminium">Aluminium</option>
                            <option value="Steel">Steel</option>
                            <option value="Iron cast">Iron cast</option>
                        </select>
                    </div>
                </div>

                <div class="flex space-x-2 pt-2">
                    <button onclick="saveProductEdit()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-2xl font-semibold transition shadow-md active:scale-95 text-xs">Save Changes</button>
                    <button onclick="deleteProductFromModal()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 px-5 py-3.5 rounded-2xl font-semibold transition border border-rose-200 text-xs">Delete</button>
                </div>
            </div>
        </div>

        <!-- CREATE PRODUCT MODAL -->
        <div id="product-create-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-sm border border-slate-100 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-900">Create New Product</h3>
                    <button onclick="closeProductCreateModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <div class="space-y-3">
                    <input type="text" id="new-prod-id" placeholder="SKU / ID (Optional)" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-prod-name" placeholder="Product Name" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-prod-cat" placeholder="Category" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Select Vendor</label>
                        <select id="new-prod-vendor" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="new-prod-price" placeholder="Sell Price (₹)" class="border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                        <input type="number" id="new-prod-cost" placeholder="Cost (₹)" class="border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    </div>
                    <input type="number" id="new-prod-stock" placeholder="Stock Qty" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-prod-img" placeholder="Image URL" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">

                    <!-- WEIGHT METAL OPTIONS FOR CREATE -->
                    <div class="space-y-2 pt-2 border-t border-slate-100">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="new-prod-is-weight" onchange="toggleCreateWeightDropdown(this.checked)" class="w-4 h-4 text-indigo-600 rounded-md border-slate-300">
                            <span class="text-xs font-bold text-slate-700">Is this a Weight-Based Metal Item?</span>
                        </label>
                        <div id="create-metal-type-container" class="hidden">
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Select Metal Type</label>
                            <select id="new-prod-metal-type" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                                <option value="Aluminium">Aluminium</option>
                                <option value="Steel">Steel</option>
                                <option value="Iron cast">Iron cast</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="addNewProduct()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-2xl font-semibold transition shadow-sm">Save Product</button>
                </div>
            </div>
        </div>

        <!-- CREATE CUSTOMER MODAL -->
        <div id="customer-create-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-sm border border-slate-100">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 id="cust-modal-heading" class="font-bold text-slate-900">Create New Customer</h3>
                    <button onclick="closeCustomerCreateModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <input type="hidden" id="cust-edit-id">
                <div class="space-y-3">
                    <input type="text" id="new-cust-shop" placeholder="Shop Name" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-cust-name" placeholder="Full Name" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-cust-contact" placeholder="Contact Number" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="email" id="new-cust-email" placeholder="Email ID" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <textarea id="new-cust-address" placeholder="Address" rows="2" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition"></textarea>
                    <button onclick="saveCustomerData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-2xl font-semibold transition shadow-sm">Save Customer</button>
                </div>
            </div>
        </div>

        <!-- CREATE VENDOR MODAL -->
        <div id="vendor-create-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-sm border border-slate-100">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 id="vend-modal-heading" class="font-bold text-slate-900">Create New Vendor</h3>
                    <button onclick="closeVendorCreateModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <input type="hidden" id="vend-edit-id">
                <div class="space-y-3">
                    <input type="text" id="new-vend-name" placeholder="Vendor Name" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-vend-person" placeholder="Contact Person" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-vend-contact" placeholder="Contact Number" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="text" id="new-vend-desc" placeholder="Description (What he sells)" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <input type="email" id="new-vend-email" placeholder="Email ID" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                    <textarea id="new-vend-address" placeholder="Address Details" rows="2" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition"></textarea>
                    <button onclick="saveVendorData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-2xl font-semibold transition shadow-sm">Save Vendor</button>
                </div>
            </div>
        </div>

        <!-- UPDATE USER PASSWORD MODAL -->
        <div id="user-password-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-sm border border-slate-100">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-900">Update User Password</h3>
                    <button onclick="closeUserPasswordModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <input type="hidden" id="update-user-id">
                <p class="text-xs text-slate-500">Updating password for user: <strong id="update-user-name" class="text-slate-900"></strong></p>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">New Password</label>
                    <input type="password" id="update-user-pass" placeholder="••••••••" class="w-full border border-slate-200 rounded-2xl p-3 text-sm bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
                </div>
                <button onclick="saveUserPassword()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-2xl text-xs font-semibold transition shadow-sm active:scale-95">Save New Password</button>
            </div>
        </div>

        <!-- SKU LOOKUP MODAL -->
        <div id="sku-lookup-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-sm border border-slate-100">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-900">🔍 Item SKU / Description Lookup</h3>
                    <button onclick="closeSkuLookupModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <div>
                    <input type="text" id="sku-search-input" placeholder="Type SKU, Model, or Description..." oninput="filterSkuLookup(this.value)" class="w-full border border-slate-200 rounded-2xl p-3.5 text-xs bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition shadow-xs">
                </div>
                <div id="sku-lookup-results" class="space-y-2.5 max-h-64 overflow-y-auto"></div>
            </div>
        </div>

        <!-- DETAIL POPUP -->
        <div id="detail-popup-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-sm border border-slate-100 text-center">
                <div id="detail-popup-icon" class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold shadow-xs">ℹ</div>
                <h3 id="detail-popup-title" class="font-bold text-base text-slate-900">Details</h3>
                <div id="detail-popup-body" class="text-xs text-slate-600 text-left space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-100"></div>
                <button onclick="closeDetailPopup()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-2xl text-xs font-semibold transition">Close</button>
            </div>
        </div>

        <!-- ORDER DETAIL MODAL -->
        <div id="order-detail-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-sm border border-slate-100 flex flex-col">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 id="modal-order-title" class="font-bold text-slate-900">Order Details</h3>
                    <button onclick="closeOrderModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
                </div>
                <div id="modal-order-body" class="space-y-3.5 flex-1 overflow-y-auto"></div>
                <div id="order-detail-actions" class="pt-3 border-t border-slate-100 flex flex-col space-y-2"></div>
            </div>
        </div>

        <!-- FULL-SCREEN IMAGE LIGHTMODAL -->
        <div id="image-modal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
            <button onclick="closeImageModal()" class="absolute top-4 right-4 bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full font-bold text-lg flex items-center justify-center transition">✕</button>
            <img id="modal-img-element" src="" alt="Product Full View" class="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl">
            <p id="modal-img-caption" class="text-white/90 text-sm mt-4 font-medium text-center"></p>
        </div>

        <!-- NOTIFICATION MODAL -->
        <div id="modal-container" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 z-[60]">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 border border-slate-100 text-center">
                <div id="modal-icon" class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold shadow-xs">ℹ</div>
                <h3 id="modal-title" class="font-bold text-base text-slate-900">Notification</h3>
                <p id="modal-message" class="text-sm text-slate-600 leading-relaxed"></p>
                <div id="modal-actions" class="flex justify-center pt-2">
                    <button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-2xl text-xs font-semibold transition shadow-sm active:scale-95">OK</button>
                </div>
            </div>
        </div>

    </div>

    <!-- CORE JAVASCRIPT LOGIC -->
    <script>
        let state = {
            view: 'login',
            user: null, 
            apiUrl: 'https://script.google.com/macros/s/AKfycbzQuJ9Ruw1SX1bT5DNrxEOtD3IJ6hSoVPNDEj4dWr5UnmF8AiW0cxS423Adp8OQrZpF/exec',
            lastRefreshTime: localStorage.getItem('gi_last_refresh') || 'Never',
            products: JSON.parse(localStorage.getItem('gi_products') || '[]'),
            customers: JSON.parse(localStorage.getItem('gi_customers') || '[]'),
            vendorsList: JSON.parse(localStorage.getItem('gi_vendors') || '[]'),
            usersList: JSON.parse(localStorage.getItem('gi_users') || '[]'),
            ordersList: JSON.parse(localStorage.getItem('gi_orders') || '[]'),
            metalPrices: JSON.parse(localStorage.getItem('gi_metal_prices') || '[]'),
            cart: {},
            storeSubView: 'catalog', 
            deliverySubTab: 'pending', 
            adminTab: 'products', 
            adminSettingsView: 'main', 
            checkoutData: { selectedCustId: '', shopName: '', fullName: '', contact: '', address: '', discount: 0 },
            orderFilters: { startDate: '', endDate: '', customerShop: '', userId: '', itemName: '' },
            adminProductSearch: '',
            adminCustomerSearch: '',
            adminVendorSearch: '',
            adminOrderSearch: '',
            deliveredSearchQuery: '',
            editingCustomer: null,
            editingVendor: null
        };

        // IDLE TIMEOUT
        let idleTimer, warningTimer;
        function resetIdleTimer() {
            if (!state.user) return;
            clearTimeout(idleTimer); clearTimeout(warningTimer);
            warningTimer = setTimeout(() => { if (state.user) showModal("Inactivity Warning", "You will be logged out in 30 seconds due to inactivity."); }, 90000);
            idleTimer = setTimeout(() => { if (state.user) { closeModal(); logout(); showModal("Session Expired", "You have been logged out due to inactivity."); } }, 120000);
        }
        ['mousemove', 'keydown', 'click', 'touchstart'].forEach(evt => window.addEventListener(evt, resetIdleTimer, true));

        // TOGGLE DROPDOWN HANDLERS
        function toggleCreateWeightDropdown(isChecked) {
            const container = document.getElementById('create-metal-type-container');
            if (isChecked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');

       // WEIGHT PRICE CALCULATOR & ROUNDER (Nearest 10g)
	function calculateWeightPrice(metalName, grams) {
            const cleanTarget = String(metalName || '').toLowerCase().trim();
            const metal = state.metalPrices.find(m => String(m.metalName || '').toLowerCase().trim() === cleanTarget);
            const ratePerKg = metal ? metal.pricePerKg : 0;
            const roundedGrams = Math.round(grams / 10) * 10;
            const kg = roundedGrams / 1000;
            const total = kg * ratePerKg;
            return { roundedGrams, ratePerKg, total: Number(total.toFixed(2)) };
        }

function addWeightItemToCart(id) {
            const inputEl = document.getElementById(`weight-input-${id}`);
            const kg = parseFloat(inputEl?.value) || 0;
            const grams = kg * 1000; // Convert kg to gm
            
            if (grams <= 0) {
                if (state.cart[id]) {
                    delete state.cart[id];
                    render();
                    showModal('Removed', 'Item removed from cart.');
                } else {
                    showModal('Invalid Weight', 'Please enter a valid weight in kg before adding to cart.');
                }
                return;
            }

            const p = state.products.find(x => String(x.id) === String(id));
            if (!p) return;

            // Check available stock (stored in kg in state.products)
            const availableKg = Number(p.stock) || 0;
            if (kg > availableKg) {
                return showModal('Stock Limit Reached', `Only ${availableKg} kg available in stock for "${p.name}". Please adjust the weight.`);
            }

            let calc = calculateWeightPrice(p.metalType, grams);
            
            state.cart[id] = { 
                product: p, 
                qty: 1, 
                grams: grams, 
                roundedGrams: calc.roundedGrams, 
                customPrice: calc.total 
            };

            render();
            showModal('Added to Cart', `Added ${kg} kg of ${p.name} for ₹${calc.total}.`);
        }

        // SMART DATE PARSER & STRICT DD-MM-YYYY FORMATTER
        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            if (dateStr instanceof Date) return dateStr;
            const str = String(dateStr).trim();
            const parts = str.split(/[\/\-]/);
            if (parts.length === 3) {
                let p0 = parseInt(parts[0], 10);
                let p1 = parseInt(parts[1], 10);
                let p2 = parseInt(parts[2], 10);
                if (parts[0].length === 4) return new Date(p0, p1 - 1, p2);
                if (parts[2].length === 4) {
                    if (p0 > 12) return new Date(p2, p1 - 1, p0);
                    if (p1 > 12) return new Date(p2, p0 - 1, p1);
                    return new Date(p2, p1 - 1, p0);
                }
            }
            let d = new Date(str);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return '';
            let d = parseSheetDate(dateStr);
            if (!d || isNaN(d.getTime())) return dateStr;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function getFilteredOrders() {
            const query = (state.adminOrderSearch || '').toLowerCase();
            let filtered = state.ordersList.filter(o => {
                const matchesShop = !state.orderFilters.customerShop || o.shopName === state.orderFilters.customerShop;
                const matchesUser = !state.orderFilters.userId || (o.userId || 'Admin') === state.orderFilters.userId;
                let matchesItem = true;
                if (state.orderFilters.itemName) {
                    matchesItem = o.rawItems && Array.isArray(o.rawItems) && o.rawItems.some(i => i.name === state.orderFilters.itemName);
                }
                let matchesSearch = !query || o.orderNo.toLowerCase().includes(query) || o.shopName.toLowerCase().includes(query) || (o.userId || '').toLowerCase().includes(query) || o.details.toLowerCase().includes(query);
                let matchesDate = true;
                const dObj = parseSheetDate(o.date);
                if (dObj && (state.orderFilters.startDate || state.orderFilters.endDate)) {
                    const oTime = new Date(dObj).setHours(0,0,0,0);
                    if (state.orderFilters.startDate && oTime < new Date(state.orderFilters.startDate).setHours(0,0,0,0)) matchesDate = false;
                    if (state.orderFilters.endDate && oTime > new Date(state.orderFilters.endDate).setHours(0,0,0,0)) matchesDate = false;
                }
                return matchesShop && matchesUser && matchesItem && matchesSearch && matchesDate;
            });
            filtered.sort((a, b) => {
                let da = parseSheetDate(a.date) || new Date(a.date);
                let db = parseSheetDate(b.date) || new Date(b.date);
                if (da.getTime() !== db.getTime()) return db - da;
                return String(b.orderNo).localeCompare(String(a.orderNo));
            });
            return filtered;
        }

        // STORE & CART LOGIC
        function filterProducts(query) {
            const q = query.toLowerCase().trim();

        function updateQty(id, change) {
            const prod = state.products.find(p => String(p.id) === String(id));
            if (!prod) return;

            const maxStock = Number(prod.stock) || 0;

            if (!state.cart[id]) {
                if (change <= 0) return;
                if (maxStock <= 0) {
                    showModal("Out of Stock", "This item is currently out of stock.");
                    return;
                }
                state.cart[id] = { product: prod, qty: 0 };
            }

            const currentQty = state.cart[id].qty;
            const newQty = currentQty + change;

            if (change > 0 && newQty > maxStock) {
                showModal("Stock Limit Reached", `Only ${maxStock} unit(s) available in stock for "${prod.name}".`);
                return;
            }

            state.cart[id].qty = newQty;

            if (state.cart[id].qty <= 0) {
                delete state.cart[id];
            }

            render();
        }

        async function submitOrder() {
            const sd = state.checkoutData;
            sd.shopName = document.getElementById('chk-shop')?.value.trim() || sd.shopName;
            sd.fullName = document.getElementById('chk-name')?.value.trim() || sd.fullName;
            sd.contact = document.getElementById('chk-contact')?.value.trim() || sd.contact;
            sd.address = document.getElementById('chk-address')?.value.trim() || sd.address;

            if (!sd.shopName || !sd.fullName || !sd.contact) {
                return showModal('Error', 'Shop Name, Full Name, and Contact Number are required.');
            }

            const items = Object.values(state.cart).filter(i => i.qty > 0 || (i.grams && i.grams > 0)).map(i => ({
                id: i.product.id,
                name: i.product.name,
                price: Number(i.customPrice ? (i.customPrice / (i.roundedGrams / 1000)) : i.product.price),
                costPrice: Number(i.product.costPrice || 0),
                qty: i.qty || 1,
                grams: i.grams || 0,
                roundedGrams: i.roundedGrams || 0,
                customPrice: i.customPrice || 0,
                img: i.product.img || ''
            }));

            if (items.length === 0) {
                return showModal('Error', 'Your cart is empty.');
            }

            for (let i = 0; i < items.length; i++) {
                const liveProd = state.products.find(p => String(p.id) === String(items[i].id));
                const available = liveProd ? (Number(liveProd.stock) || 0) : 0;
                if (!items[i].grams && items[i].qty > available) {
                    return showModal("Stock Changed", `"${items[i].name}" only has ${available} left. Please adjust your cart.`);
                }
            }

            const amount = Object.values(state.cart).reduce((a, i) => a + (i.customPrice || (i.product.price * i.qty)), 0);
            const totalCost = items.reduce((a, i) => a + (i.costPrice * i.qty), 0);
const details = Object.values(state.cart).map(i => i.grams ? `${i.product.name} (${(i.roundedGrams / 1000).toFixed(3)} kg - ₹${i.customPrice})` : `${i.product.name} (x${i.qty})`).join(', ');

            try {
                showLoading('Placing order & updating stock...');
                const res = await fetch(state.apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'submitOrder',
                        date: new Date().toLocaleDateString(),
                        shopName: sd.shopName,
                        fullName: sd.fullName,
                        contact: sd.contact,
                        address: sd.address,
                        orderListDetails: details,
                        discount: 0,
                        amount,
                        totalCost,
                        cartItems: items,
                        userId: state.user?.userId || 'Admin'
                    })
                });
                const data = await res.json();
                hideLoading();

                if (data.status === 'success') {
                    items.forEach(orderedItem => {
                        const localProd = state.products.find(p => String(p.id) === String(orderedItem.id));
                        if (localProd && !orderedItem.grams) {
                            localProd.stock = Math.max(0, (Number(localProd.stock) || 0) - orderedItem.qty);
                        }
                    });
                    localStorage.setItem('gi_products', JSON.stringify(state.products));

                    state.cart = {};
                    state.view = 'success';
                    render();
                    fetchData(true);
                } else {
                    showModal('Error', 'Failed to record order.');
                }
            } catch(e) {
                hideLoading();
                showModal('Error', 'Network error during checkout.');
            }
        }

        function renderProductItems(products) {
            if (!products || products.length === 0) return `<div class="text-center py-16 text-slate-400 text-sm font-medium">No products found in this section.</div>`;
            return products.map(p => {
                const stringId = String(p.id);
                const qty = state.cart[stringId]?.qty || 0;
                const stockNum = Number(p.stock) || 0;
                const isOutOfStock = stockNum <= 0;
                const imgHtml = renderImgThumbnail(p.img, p.name, "w-16 h-16");
                
                // Define weight check FIRST
                const isWeightBased = Boolean(p.metalType);
                
                // Now stockDisplay and stockBadge can use isWeightBased safely
const stockDisplay = isWeightBased ? `${stockNum} kg` : `${stockNum} units`;
                const stockBadge = isOutOfStock ? '<span class="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full border border-rose-100">Out of Stock</span>' : `<span class="text-xs text-slate-500 font-semibold">Stock: ${stockDisplay} left</span>`;
                
                let currentGrams = state.cart[stringId]?.grams !== undefined ? state.cart[stringId].grams : '';
                let calc = calculateWeightPrice(p.metalType, currentGrams || 0); // <-- Changed 450 to 0

                const actionBtn = isWeightBased ? `
                    <div class="flex flex-col items-end space-y-1.5">
                        <div class="flex items-center space-x-1">
                            <input type="number" step="any" id="weight-input-${stringId}" value="${currentGrams ? (currentGrams / 1000) : ''}" oninput="updateWeightInputPreview('${stringId}', this.value)" class="w-20 border border-slate-200 rounded-xl p-1.5 text-xs text-center font-bold bg-slate-50 focus:bg-white" placeholder="0.00">
                            <span class="text-xs text-slate-500 font-medium">kg</span>
                        </div>
                        <div id="weight-preview-${stringId}" class="text-[11px] text-emerald-600 font-bold">
                            ${currentGrams ? `₹${calculateWeightPrice(p.metalType, currentGrams).total} (${(currentGrams/1000).toFixed(3)} kg)` : '₹0 (0 kg)'}
                        </div>
                        <button onclick="addWeightItemToCart('${stringId}')" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-xs">Add to Cart</button>
                    </div>
                ` : (!isOutOfStock ? (qty > 0 ? `<button onclick="updateQty('${stringId}', -1)" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-bold flex items-center justify-center transition shadow-xs">-</button><span class="w-7 text-center text-sm font-bold text-slate-900">${qty}</span><button onclick="updateQty('${stringId}', 1)" class="w-9 h-9 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold flex items-center justify-center transition shadow-sm">+</button>` : `<button onclick="updateQty('${stringId}', 1)" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-2xl text-xs font-semibold transition shadow-xs">Add</button>`) : '<span class="text-xs text-slate-400 italic font-medium">Unavailable</span>');

                return `
                    <div class="bg-white border border-slate-200/80 rounded-3xl p-4 flex justify-between items-center shadow-xs hover:shadow-md transition ${isOutOfStock ? 'opacity-60 bg-slate-50/50' : ''}">
                        <div class="flex items-center space-x-4">
                            ${imgHtml}
                            <div class="space-y-1">
                                <span class="text-[11px] uppercase tracking-wider bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full font-bold">${p.category || 'General'}</span>
                                <h4 class="font-bold text-sm text-slate-900">${p.name}</h4>
                                <div class="text-sm font-bold text-slate-900">${isWeightBased ? `₹${calc.ratePerKg} <span class="text-xs font-normal text-slate-500">/ kg (${p.metalType})</span>` : `₹${p.price} <span class="text-xs font-normal text-slate-500">/ unit</span>`}</div>
                                ${stockBadge}
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">${actionBtn}</div>
                    </div>
                `;
            }).join('');
        }

function updateWeightInputPreview(id, kgVal) {
            const kg = parseFloat(kgVal) || 0;
            const grams = kg * 1000;
            const p = state.products.find(x => String(x.id) === String(id));
            if (!p) return;
            
            let calc = calculateWeightPrice(p.metalType, grams);
            const previewEl = document.getElementById(`weight-preview-${id}`);
            if (previewEl) {
                previewEl.innerText = grams > 0 ? `₹${calc.total} (${kg} kg)` : '₹0 (0 kg)';
            }
        }

        function renderAdminDeliveryTab() {
            const isPending = state.deliverySubTab === 'pending';
            const query = (state.deliveredSearchQuery || '').toLowerCase();

            const relevantOrders = state.ordersList.filter(o => {
                if (o.status === 'Cancelled') return false;
                if (isPending) {
                    return o.status !== 'Delivered';
                } else {
                    const matchesTab = o.status === 'Delivered';
                    const matchesSearch = !query || o.orderNo.toLowerCase().includes(query) || o.shopName.toLowerCase().includes(query) || o.details.toLowerCase().includes(query);
                    return matchesTab && matchesSearch;
                }
            });

            relevantOrders.sort((a, b) => {
                if (!isPending) {
                    let da = parseSheetDate(a.deliveredDate) || parseSheetDate(a.date) || new Date(0);
                    let db = parseSheetDate(b.deliveredDate) || parseSheetDate(b.date) || new Date(0);
                    if (da.getTime() !== db.getTime()) return db - da;
                } else {
                    let da = parseSheetDate(a.date) || new Date(a.date);
                    let db = parseSheetDate(b.date) || new Date(b.date);
                    if (da.getTime() !== db.getTime()) return db - da;
                }
                return String(b.orderNo).localeCompare(String(a.orderNo));
            });

            const cards = relevantOrders.length ? relevantOrders.map(o => `
                <div onclick="openOrderDetailsModal('${o.orderNo}')" class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5 text-xs space-y-1 cursor-pointer hover:bg-slate-100 transition shadow-xs">
                    <div class="flex justify-between items-center text-sm font-bold">
                        <span class="text-rose-600 tracking-tight">ORDER # <span class="text-slate-900">${o.orderNo}</span></span>
                        <span class="text-xs text-slate-500 font-normal">Date: ${formatDisplayDate(o.date)}</span>
                        <span class="text-emerald-700 font-bold">₹${Number(o.amount || 0).toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-1">
                        <span class="font-bold text-slate-900 text-xs">${o.shopName}</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${isPending ? 'bg-amber-50 text-amber-700 border border-amber-100' : 'bg-emerald-50 text-emerald-700 border border-emerald-100'}">${isPending ? 'Pending' : 'Delivered'}</span>
                    </div>
                </div>

            return `
                <div class="space-y-4">

                        <button onclick="state.deliverySubTab='pending'; render();" class="flex-1 py-2.5 text-center rounded-xl transition ${isPending ? 'bg-white font-bold text-slate-900 shadow-sm' : 'text-slate-500'}">Pending Deliveries</button>
                        <button onclick="state.deliverySubTab='delivered'; render();" class="flex-1 py-2.5 text-center rounded-xl transition ${!isPending ? 'bg-white font-bold text-slate-900 shadow-sm' : 'text-slate-500'}">Delivered Status</button>

                    ${!isPending ? `
                        <div>
                            <input type="text" id="delivered-search" value="${state.deliveredSearchQuery}" placeholder="🔍 Search delivered items by order no, shop, or items..." oninput="state.deliveredSearchQuery=this.value; render();" class="w-full border border-slate-200 rounded-2xl p-3 text-xs bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600 transition shadow-xs">
                        </div>
                    ` : ''}
                    <div class="space-y-2.5">${cards}</div>
                </div>
            `;

                        itemCounts[item.name].revenue += (Number(item.qty) || 0) * (Number(item.price) || 0);

                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Start Date</label>

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">End Date</label>
                                <input type="date" id="rep-end" value="${state.orderFilters.endDate}" onchange="state.orderFilters.endDate=this.value; render();" class="w-full border border-slate-200 rounded-2xl p-3 text-xs bg-white shadow-xs">
                            </div>

                        <div class="grid grid-cols-2 gap-3">

                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold shadow-xs">📊</div>
                            <h4 class="font-bold text-base text-slate-900">Summary & P&L Analytics</h4>

                        <div class="bg-slate-50/80 border border-slate-200/60 rounded-2xl p-4 space-y-3 text-sm">
                            <div class="flex justify-between font-medium"><span>Total Sales:</span><span class="font-bold text-slate-900">₹${totalSales.toFixed(2)}</span></div>

        function downloadCSVReport() {
            const orders = getFilteredOrders();
            let csv = "Date,Order No,Shop,User,Amount\\n";
            orders.forEach(o => {
                csv += `"${o.date}","${o.orderNo}","${o.shopName}","${o.userId || 'Admin'}","${o.amount}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "P&L_Report.csv";
            a.click();
            window.URL.revokeObjectURL(url);
        }

async function addNewProduct() {
            const id = document.getElementById('new-prod-id').value.trim();
            const name = document.getElementById('new-prod-name').value.trim();
            const category = document.getElementById('new-prod-cat').value.trim();
            const vendor = document.getElementById('new-prod-vendor').value.trim();

            const metalType = isWeightChecked ? document.getElementById('new-prod-metal-type').value : '';
            
            // If it's weight-based, price can default to 0 because it dynamically calculates from live metal rates
            let price = document.getElementById('new-prod-price').value.trim();
            if (isWeightChecked && !price) {
                price = '0'; 
            }

            const costPrice = document.getElementById('new-prod-cost').value.trim();
            const stock = document.getElementById('new-prod-stock').value.trim();
            const img = document.getElementById('new-prod-img').value.trim();

            if (!name || (!price && !isWeightChecked)) {

            }

            try {
                showLoading('Adding product...');
                await fetch(state.apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'addProduct', 
                        id: id || ('P' + Date.now().toString().slice(-4)), 
                        name, 
                        category, 
                        price, 
                        stock: stock || 10, 
                        img, 
                        costPrice, 
                        vendor, 
                        metalType 
                    })
                });
                hideLoading();
                closeProductCreateModal();
                fetchAdminDashboardData();
            } catch(e) {
                hideLoading();
                showModal('Error', 'Failed to add product.');
            }
        }

            let action = editId ? 'updateCustomer' : 'addCustomer';
            let payload = { shop, name, contact, email, address };
            if (editId) payload.id = editId;

            try {
                showLoading('Saving customer...');
                await fetch(state.apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...payload })
                });
                hideLoading();
                closeCustomerCreateModal();
                fetchAdminDashboardData();
            } catch(e) {
                hideLoading();
                showModal('Error', 'Failed to save customer.');
            }
        }

        function showCustomerDetails(id) {
            const c = state.customers.find(item => String(item.id) === String(id));
            if (!c) return;
            document.getElementById('detail-popup-title').innerText = "Customer Details";
            document.getElementById('detail-popup-body').innerHTML = `
                <div><strong>Shop:</strong> ${c.shop}</div>
                <div><strong>Name:</strong> ${c.name}</div>
                <div><strong>Contact:</strong> ${c.contact}</div>
                <div><strong>Email:</strong> ${c.email || 'None'}</div>
                <div><strong>Address:</strong> ${c.address || 'None'}</div>
                <div class="pt-3 flex space-x-2">
                    <button onclick="closeDetailPopup(); startEditCustomer('${c.id}')" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-semibold text-xs">Update</button>
                    <button onclick="closeDetailPopup(); deleteCustomer('${c.id}')" class="flex-1 bg-rose-600 text-white py-2 rounded-xl font-semibold text-xs">Delete</button>
                </div>
            `;
            document.getElementById('detail-popup-modal').classList.remove('hidden');
        }

        async function deleteCustomer(id) {
            if (!confirm("Delete?")) return;
            try {
                showLoading();
                await fetch(state.apiUrl, { method: 'POST', body: JSON.stringify({ action: 'deleteCustomer', id }) });
                fetchData(true);
            } catch(e) { hideLoading(); }
        }

        function openVendorCreateModal() {
            state.editingVendor = null;
            document.getElementById('vend-modal-heading').innerText = "Create New Vendor";
            document.getElementById('new-vend-name').value = '';
            document.getElementById('new-vend-person').value = '';
            document.getElementById('new-vend-contact').value = '';
            document.getElementById('new-vend-desc').value = '';
            document.getElementById('new-vend-email').value = '';
            document.getElementById('new-vend-address').value = '';
            document.getElementById('vend-edit-id').value = '';
            document.getElementById('vendor-create-modal').classList.remove('hidden');
        }

        function closeVendorCreateModal() { document.getElementById('vendor-create-modal').classList.add('hidden'); }

        async function saveVendorData() {
            const vendorName = document.getElementById('new-vend-name').value.trim();
            const contactPerson = document.getElementById('new-vend-person').value.trim();
            const contactNumber = document.getElementById('new-vend-contact').value.trim();
            const description = document.getElementById('new-vend-desc').value.trim();
            const email = document.getElementById('new-vend-email').value.trim();
            const address = document.getElementById('new-vend-address').value.trim();
            const editId = document.getElementById('vend-edit-id').value;

            if (!vendorName) return showModal('Error', 'Vendor Name is required.');

            let action = editId ? 'updateVendor' : 'addVendor';
            let payload = { vendorName, contactPerson, contactNumber, description, email, address };
            if (editId) payload.id = editId;

            try {
                showLoading('Saving vendor...');
                await fetch(state.apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...payload })
                });
                hideLoading();
                closeVendorCreateModal();
                fetchAdminDashboardData();
            } catch(e) {
                hideLoading();
                showModal('Error', 'Failed to save vendor.');
            }
        }

        function startEditVendor(id) {
            const v = state.vendorsList.find(item => String(item.id) === String(id));
            if (!v) return;
            state.editingVendor = v;
            document.getElementById('vend-modal-heading').innerText = "Update Vendor Details";
            document.getElementById('new-vend-name').value = v.vendorName || '';
            document.getElementById('new-vend-person').value = v.contactPerson || '';
            document.getElementById('new-vend-contact').value = v.contactNumber || '';
            document.getElementById('new-vend-desc').value = v.description || '';
            document.getElementById('new-vend-email').value = v.email || '';
            document.getElementById('new-vend-address').value = v.address || '';
            document.getElementById('vend-edit-id').value = v.id;
            document.getElementById('vendor-create-modal').classList.remove('hidden');
        }

        function showVendorDetails(id) {
            const v = state.vendorsList.find(item => String(item.id) === String(id));
            if (!v) return;
            document.getElementById('detail-popup-title').innerText = "Vendor Details";
            document.getElementById('detail-popup-body').innerHTML = `
                <div><strong>Vendor:</strong> ${v.vendorName}</div>
                <div><strong>Contact:</strong> ${v.contactPerson || '-'} (${v.contactNumber || '-'})</div>
                <div><strong>Description:</strong> ${v.description || '-'}</div>
                <div><strong>Email:</strong> ${v.email || 'None'}</div>
                <div><strong>Address:</strong> ${v.address || 'None'}</div>
                <div class="pt-3 flex space-x-2">
                    <button onclick="closeDetailPopup(); startEditVendor('${v.id}')" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-semibold text-xs">Update</button>
                    <button onclick="closeDetailPopup(); deleteVendor('${v.id}')" class="flex-1 bg-rose-600 text-white py-2 rounded-xl font-semibold text-xs">Delete</button>
                </div>
            `;
            document.getElementById('detail-popup-modal').classList.remove('hidden');
        }

        async function deleteVendor(id) {
            if (!confirm("Delete?")) return;
            try {
                showLoading();
                await fetch(state.apiUrl, { method: 'POST', body: JSON.stringify({ action: 'deleteVendor', id }) });
                fetchData(true);
            } catch(e) { hideLoading(); }
        }

        function openSkuLookupModal() {
            document.getElementById('sku-search-input').value = '';
            document.getElementById('sku-lookup-modal').classList.remove('hidden');
        }

        function closeSkuLookupModal() { document.getElementById('sku-lookup-modal').classList.add('hidden'); }

        function filterSkuLookup(query) {
            const v = query.toLowerCase();
            const c = document.getElementById('sku-lookup-results');
            const res = state.products.filter(p => p.name.toLowerCase().includes(v) || String(p.id).toLowerCase().includes(v));
            c.innerHTML = res.map(p => `
                <div onclick="showVendorForProduct('${p.name}', '${p.id}', '${p.vendor}')" class="bg-slate-50 border p-3 rounded-2xl flex justify-between cursor-pointer">
                    <div><b>${p.name}</b></div>
                    <span class="text-indigo-600">&rarr;</span>
                </div>
            `).join('');
        }

        function showVendorForProduct(n, sku, vId) {
            closeSkuLookupModal();
            const v = state.vendorsList.find(x => x.id === vId);
            document.getElementById('detail-popup-title').innerText = "Vendor Details";
            document.getElementById('detail-popup-body').innerHTML = `
                <b>Item:</b> ${n}<hr class="border-slate-200 my-1.5">
                ${v ? `<b>Vendor:</b> ${v.vendorName}<br><b>Phone:</b>${v.contactNumber}` : `<i class="text-rose-600">No vendor assigned</i>`}
            `;
            document.getElementById('detail-popup-modal').classList.remove('hidden');
        }

        async function addNewUserWithRole() {
            const d = {
                action: 'addUser',
                newUserId: document.getElementById('new-uid').value,
                newUserPassword: document.getElementById('new-upass').value,
                role: document.getElementById('new-uroll').value
            };
            showLoading();
            try {
                await fetch(state.apiUrl, { method: 'POST', body: JSON.stringify(d) });
                fetchData(true);
            } catch(e) { hideLoading(); }
        }

        // API CALLS
        async function fetchData(forceRefresh = false) {
            if (!state.apiUrl) return;
            try {
                const [p, c, v, u, o] = await Promise.all([
                    fetch(state.apiUrl + '?action=getProducts'),
                    fetch(state.apiUrl + '?action=getCustomers'),
                    fetch(state.apiUrl + '?action=getVendors'),
                    fetch(state.apiUrl + '?action=getUsers'),
                    fetch(state.apiUrl + '?action=getOrders')
                ]);
                state.products = (await p.json()).products || [];
                state.customers = (await c.json()).customers || [];
                state.vendorsList = (await v.json()).vendors || [];
                state.usersList = (await u.json()).users || [];
                state.ordersList = (await o.json()).orders || [];

                localStorage.setItem('gi_products', JSON.stringify(state.products));
                localStorage.setItem('gi_customers', JSON.stringify(state.customers));
                localStorage.setItem('gi_vendors', JSON.stringify(state.vendorsList));
                localStorage.setItem('gi_users', JSON.stringify(state.usersList));
                localStorage.setItem('gi_orders', JSON.stringify(state.ordersList));

                state.lastRefreshTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem('gi_last_refresh', state.lastRefreshTime);

                hideLoading();
                render();
            } catch(e) { hideLoading(); }
        }

        async function fetchAdminDashboardData() {
            await fetchData(true);
        }

        async function handleUserLogin() {
            const uid = document.getElementById('login-userid').value.trim().toLowerCase();
            const pwd = document.getElementById('login-password').value.trim();
            if (!uid || !pwd) return showModal('Error', 'Please enter both User ID and Password.');

            showLoading('Verifying credentials...');
            try {
                const res = await fetch(state.apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', userId: uid, password: pwd })
                });
                const data = await res.json();
                if (data.success) {
                    state.user = { userId: uid, role: data.role || 'Sales' };
                    localStorage.setItem('gi_logged_user', JSON.stringify(state.user));
                    state.view = 'store';
                    fetchData(true);
                } else {
                    hideLoading();
                    showModal('Access Denied', 'Invalid credentials or suspended account.');
                }
            } catch(e) {
                hideLoading();
                showModal('Error', 'Connection failed.');
            }
        }

        async function verifyAdminLogin() {
            const pwd = document.getElementById('admin-password-input').value.trim();
            if (!pwd) return;

            showLoading('Verifying password...');
            try {
                const res = await fetch(state.apiUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'adminLogin', password: pwd })
                });
                const data = await res.json();
                if (data.success) {
                    state.user = { userId: 'Admin', role: 'Admin' };
                    localStorage.setItem('gi_logged_user', JSON.stringify(state.user));
                    state.adminTab = 'products';
                    state.view = 'admin-dashboard';
                    fetchData(true);
                } else {
                    hideLoading();
                    showModal('Access Denied', 'Incorrect admin password.');
                }
            } catch(e) {
                hideLoading();
                showModal('Error', 'Connection failed.');
            }
        }

function filterAdminProductsDOM(query) {
            state.adminProductSearch = query;
            const container = document.getElementById('admin-product-cards-container');
            if (!container) return;
            const q = query.toLowerCase();
            const filteredProducts = state.products.filter(p => p.name.toLowerCase().includes(q) || String(p.id).toLowerCase().includes(q));
            
            container.innerHTML = filteredProducts.length ? filteredProducts.map(p => {
                const thumb = renderImgThumbnail(p.img, p.name, "w-12 h-12");
                const stockNum = Number(p.stock) || 0;
                const stockLabel = stockNum > 0 ? 'In Stock' : 'Out';
                const isWeightBased = Boolean(p.metalType);
                const stockDisplay = isWeightBased ? `${stockNum} kg` : `${stockNum} units`;
                const matchedVendor = state.vendorsList.find(v => v.id === p.vendor);
                const vendorDisplay = matchedVendor ? matchedVendor.vendorName : (p.vendor || 'Unassigned');

                return `
                    <div class="bg-white border border-slate-200/80 rounded-2xl p-3 flex justify-between items-center text-xs shadow-xs hover:shadow-md transition">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            ${thumb}
                            <div class="truncate space-y-0.5">
                                <div class="font-bold text-slate-900 text-xs truncate">${p.name} <span class="text-slate-400 font-normal">(${p.category || 'General'})</span></div>
                                <div class="text-slate-500 text-[11px]">Sell: ₹${p.price} | Cost: ₹${p.costPrice || 0} | Stock: ${stockDisplay}</div>
                                <div class="text-indigo-600 font-semibold text-[11px] truncate">Vendor: ${vendorDisplay} ${p.metalType ? `| Metal: ${p.metalType}` : ''}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <button onclick="openEditProductModal('${p.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-semibold transition">Edit</button>
                            <button onclick="toggleStock('${p.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 px-3 py-1.5 rounded-xl font-semibold transition border border-amber-200/60">${stockLabel}</button>
                        </div>
                    </div>
                `;
            }).join('') : '<div class="text-center py-12 text-slate-400 text-xs">No matching products found.</div>';
        }

        function filterAdminCustomersDOM(query) {
            state.adminCustomerSearch = query;
            const container = document.getElementById('admin-customer-cards-container');
            if (!container) return;
            const q = query.toLowerCase();
            const filteredCustomers = state.customers.filter(c => c.shop.toLowerCase().includes(q) || c.name.toLowerCase().includes(q));
            
            container.innerHTML = filteredCustomers.length ? filteredCustomers.map(c => `
                <div onclick="showCustomerDetails('${c.id}')" class="bg-white border border-slate-200/80 rounded-2xl p-3.5 text-sm flex justify-between items-center shadow-xs cursor-pointer hover:shadow-md transition">
                    <div class="font-bold text-slate-900 text-sm">${c.shop}</div>
                    <span class="text-indigo-600 font-semibold text-xs">&rarr; View</span>
                </div>
            `).join('') : '<div class="text-center py-12 text-slate-400 text-xs">No matching customers found.</div>';
        }

        function filterAdminVendorsDOM(query) {
            state.adminVendorSearch = query;
            const container = document.getElementById('admin-vendor-cards-container');
            if (!container) return;
            const q = query.toLowerCase();
            const filteredVendors = state.vendorsList.filter(v => v.vendorName.toLowerCase().includes(q) || (v.description && v.description.toLowerCase().includes(q)));
            
            container.innerHTML = filteredVendors.length ? filteredVendors.map(item => `
                <div onclick="showVendorDetails('${item.id}')" class="bg-white border border-slate-200/80 rounded-2xl p-3.5 text-sm flex justify-between items-center shadow-xs cursor-pointer hover:shadow-md transition">
                    <div class="font-bold text-slate-900 text-base">${item.vendorName} <span class="text-xs text-slate-400 font-medium">[ID: ${item.id}]</span></div>
                    <span class="text-indigo-600 font-semibold text-xs">&rarr; View</span>
                </div>
            `).join('') : '<div class="text-center py-12 text-slate-400 text-xs">No matching vendors found.</div>';
        }

        function filterAdminOrdersDOM(query) {
            state.adminOrderSearch = query;
            const container = document.getElementById('admin-order-cards-container');
            if (!container) return;
            const filteredOrders = getFilteredOrders();
            
            container.innerHTML = filteredOrders.length ? filteredOrders.map(o => {
                const isCancelled = o.status === 'Cancelled';
                return `
                    <div onclick="openOrderDetailsModal('${o.orderNo}')" class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5 text-xs space-y-1 cursor-pointer hover:bg-slate-100 transition shadow-xs">
                        <div class="flex justify-between items-center text-sm font-bold">
                            <span class="text-rose-600 tracking-tight">ORDER # <span class="text-slate-900">${o.orderNo}</span></span>
                            <span class="text-xs text-slate-500 font-normal">Date: ${formatDisplayDate(o.date)}</span>
                            <span class="${isCancelled ? 'text-rose-600 line-through' : 'text-emerald-700'} font-bold">₹${Number(o.amount || 0).toFixed(2)}</span>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <span class="font-bold text-slate-900 text-xs">${o.shopName}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${isCancelled ? 'bg-rose-50 text-rose-600' : (o.status==='Delivered' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700')}">${o.status || 'Confirmed'}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<div class="text-center py-12 text-slate-400 text-xs">No matching orders found.</div>';
        }

        // INITIALIZATION
        window.onload = function() {
            const savedUser = localStorage.getItem('gi_logged_user');
            if (savedUser) {
                try {
                    state.user = JSON.parse(savedUser);
                    if (state.user.role === 'Admin') {
                        state.view = 'admin-dashboard';
                        state.adminTab = 'products';
                    } else {
                        state.view = 'store';
                    }
                } catch(e) {}
            }
            render();
            if (state.apiUrl) {
                fetchData();
                fetchMetalPrices();
            }
        };
    </script>
</body>
</html>
